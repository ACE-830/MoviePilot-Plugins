name: Plugin checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest
      - run: python -m compileall -q plugins.v3
      - run: python scripts/check_plugin_versions.py package.json package.v2.json package.v3.json
      - run: python -m pytest
      - run: git diff --check
